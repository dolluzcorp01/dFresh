# FIRST INSTALL ONLY (runbook step 6): plain http for dfresh.us + www, so certbot can prove the domain before any
# certificate exists. Replaced by deploy/nginx/dfresh.conf as soon as the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name dfresh.us www.dfresh.us;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
