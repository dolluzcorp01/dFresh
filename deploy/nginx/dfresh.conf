# nginx server block for the dFresh site + API on ONE domain (deploy/DEPLOY.md).
# Replace every <DOMAIN> (e.g. dfresh.example) and <APP_DIR> (e.g. /var/www/dfresh) before enabling.
# Node (pm2 "dfresh") listens on 127.0.0.1:4012 and serves /api, the SEO HTML for every page (seo.js),
# /sitemap.xml and /robots.txt. nginx serves the hashed build files and /media straight from disk.

# http -> https, and www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> www.<DOMAIN>;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://<DOMAIN>$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.<DOMAIN>;
    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    return 301 https://<DOMAIN>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # Admin uploads: photos up to 8 MB, PDFs 5 MB, Excel 5 MB (Admin_server.js). A little headroom for the form.
    client_max_body_size 10m;

    # Security headers. Turn HSTS on only once the final domain is settled (it is cached by browsers for a year).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Text compression (Lighthouse "text compression" was 1.8 s on mobile without it).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml;
    # Brotli is smaller still, but needs the ngx_brotli module (not in Ubuntu's stock nginx). If installed:
    # brotli on; brotli_comp_level 5; brotli_types text/plain text/css text/xml application/javascript
    #   application/json application/xml application/manifest+json image/svg+xml;

    # CRA build files: content hash in every name -> cache for a year.
    location /static/ {
        alias <APP_DIR>/build/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Product / banner / logo images: a new upload is a new file name -> cache 30 days.
    location /media/ {
        alias <APP_DIR>/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # No `root` on purpose: only /static and /media come from disk; private/ (brochures, keys) and the sources are
    # never reachable, node streams a brochure only with a valid token.

    # Everything else -> node: /api, the per-URL SEO HTML (no-cache), sitemap.xml, robots.txt, favicon, manifest.
    location / {
        proxy_pass http://127.0.0.1:4012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: server.js trusts only loopback, so req.ip = this value = the visitor
        # (lead rate limit + ip_hash). A visitor-sent X-Forwarded-For is dropped here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
