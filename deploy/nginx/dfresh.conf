# nginx: dFresh site + API on ONE domain, https://dfresh.us (deploy/DEPLOY.md). Install as
# /etc/nginx/sites-available/dfresh.us.conf (step 6 of the runbook). Only the two dfresh.us names are served here.
# Node (pm2 "dfresh-api") listens on 127.0.0.1:4012 and serves /api, the SEO HTML for every page (seo.js),
# /sitemap.xml and /robots.txt. nginx serves the hashed build files and /media straight from disk.
#
# Maintenance page: `touch /var/www/dfresh/maintenance.on` -> every page and API call answers 503 with
# deploy/maintenance/index.html (Retry-After, so search engines keep the old pages); `rm` the file to reopen.
# No reload needed. The same page shows while node is down or restarting (502 / 504).

# http -> https, and www -> bare domain. Let's Encrypt renewals use the webroot below.
server {
    listen 80;
    listen [::]:80;
    server_name dfresh.us www.dfresh.us;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dfresh.us$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dfresh.us;
    ssl_certificate     /etc/letsencrypt/live/dfresh.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfresh.us/privkey.pem;
    return 301 https://dfresh.us$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dfresh.us;

    ssl_certificate     /etc/letsencrypt/live/dfresh.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfresh.us/privkey.pem;

    # Admin uploads: photos up to 8 MB, PDFs 5 MB, Excel 5 MB (Admin_server.js). A little headroom for the form.
    client_max_body_size 10m;

    # Security headers. HSTS: turn on about a week after launch, once https on both names is proven (browsers cache
    # it for a year, so a mistake cannot be undone quickly).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Text compression (Lighthouse "text compression" was 1.8 s on mobile without it).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/woff2;

    # Maintenance page (see the top of this file). Served from the repo, so it is there even when node is not.
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/dfresh/deploy/maintenance;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "600" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # CRA build files: content hash in every name -> cache for a year.
    location /static/ {
        alias /var/www/dfresh/build/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # E-mail header logo (Settings mail_logo_url): cached a year; a changed logo gets a new file name.
    location /media/mail/ {
        alias /var/www/dfresh/media/mail/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Product / banner / logo images and the script fonts (media/fonts, content-hashed names): a new upload is a new
    # file name -> cache 30 days. Admin uploads land here (written by node, read by nginx).
    location /media/ {
        alias /var/www/dfresh/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # No `root` on purpose: only /static and /media come from disk; private/ (brochures, Google key, font state),
    # .env, build-ssr/ and the sources are never reachable. A brochure is streamed by node only with a valid token.

    # Everything else -> node: /api (incl. admin API), /admin (the admin app shell, noindex), every page's SEO HTML
    # (no-cache), sitemap.xml, robots.txt, favicon, manifest.
    location / {
        # an error_page here replaces the server-level one, so 503 (the flag above) is listed again
        if (-f /var/www/dfresh/maintenance.on) { return 503; }
        error_page 502 503 504 =503 @maintenance;

        proxy_pass http://127.0.0.1:4012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: server.js trusts only loopback, so req.ip = this value = the visitor
        # (lead rate limit + ip_hash). A visitor-sent X-Forwarded-For is dropped here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
