# nginx: dFresh site + API on ONE domain, https://dfresh.us (deploy/DEPLOY.md). Install as
# /etc/nginx/sites-available/dfresh.us.conf (step 6 of the runbook). Only the two dfresh.us names are served here.
# Node (pm2 "dfresh-api") listens on 127.0.0.1:4012 and serves /api, the SEO HTML for every page (seo.js),
# /sitemap.xml and /robots.txt. nginx serves the hashed build files and /media straight from disk.
#
# Maintenance (same mechanism as dAssist, with dFresh's own page):
# - switch file: `touch /var/www/dfresh/MAINTENANCE` -> every public page answers 503 + Retry-After with
#   /var/www/dfresh/maintenance/maintenance.html; `rm` it to reopen. No nginx reload needed.
# - /admin and /api/ are NOT switched off by it: they work exactly as without maintenance (staff can check).
# - the same page is shown automatically when node is down or restarting (502 / 504, sent as 503), and for
#   nginx's own 403 / 404 / 500 (e.g. a missing /static file).
# The page is self-contained (its images in maintenance/assets, served as /maintenance-assets/).

# http -> https, and www -> bare domain. Let's Encrypt renewals use the webroot below.
server {
    listen 80;
    listen [::]:80;
    server_name dfresh.us www.dfresh.us;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dfresh.us$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dfresh.us;
    ssl_certificate     /etc/letsencrypt/live/dfresh.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfresh.us/privkey.pem;
    return 301 https://dfresh.us$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dfresh.us;

    ssl_certificate     /etc/letsencrypt/live/dfresh.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dfresh.us/privkey.pem;

    # Admin uploads: photos up to 8 MB, PDFs 5 MB, Excel 5 MB (Admin_server.js). A little headroom for the form.
    client_max_body_size 10m;

    # Security headers. HSTS: turn on about a week after launch, once https on both names is proven (browsers cache
    # it for a year, so a mistake cannot be undone quickly).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Text compression (Lighthouse "text compression" was 1.8 s on mobile without it).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/woff2;

    # Proxy settings for every location that goes to node (/, /api/, /admin).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: server.js trusts only loopback, so req.ip = this value = the visitor
    # (lead rate limit + ip_hash). A visitor-sent X-Forwarded-For is dropped here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;

    # Maintenance page (see the top of this file). Only nginx's own errors land here (node's JSON / text answers
    # pass through untouched: no proxy_intercept_errors). Node down (502 / 504) is sent as 503 like the switch.
    error_page 403 404 500 503 /maintenance.html;
    error_page 502 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/dfresh/maintenance;
        internal;
        add_header Retry-After "300" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    # Its logo and favicons (never behind the switch, or the page could not load them).
    location ^~ /maintenance-assets/ {
        alias /var/www/dfresh/maintenance/assets/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # CRA build files: content hash in every name -> cache for a year.
    location /static/ {
        alias /var/www/dfresh/build/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # E-mail header logo (Settings mail_logo_url): cached a year; a changed logo gets a new file name.
    location /media/mail/ {
        alias /var/www/dfresh/media/mail/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Product / banner / logo images and the script fonts (media/fonts, content-hashed names): a new upload is a new
    # file name -> cache 30 days. Admin uploads land here (written by node, read by nginx).
    location /media/ {
        alias /var/www/dfresh/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # No `root` on purpose: only /static and /media come from disk; private/ (brochures, Google key, font state),
    # .env, build-ssr/ and the sources are never reachable. A brochure is streamed by node only with a valid token.

    # API and admin -> node, never behind the maintenance switch.
    location /api/ {
        proxy_pass http://127.0.0.1:4012;
    }
    location ~ ^/admin(/.*)?$ {
        proxy_pass http://127.0.0.1:4012;
    }

    # Everything else -> node: every page's SEO HTML (no-cache), sitemap.xml, robots.txt, favicon, manifest.
    # Behind the maintenance switch. (No error_page in here: it would replace the server-level ones.)
    location / {
        if (-f /var/www/dfresh/MAINTENANCE) { return 503; }
        proxy_pass http://127.0.0.1:4012;
    }
}
